server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on-param

spring:
  application:
    name: freshman-orientation

  # 数据源配置 - MySQL
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/freshman_orientation?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # Thymeleaf配置
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
    suffix: .html
    servlet:
      content-type: text/html

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

  # H2控制台
  h2:
    console:
      enabled: true
      path: /h2-console

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.freshman.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    root: info
    com.freshman: debug
    org.springframework.security: info

# 自定义配置
app:
  name: 智慧迎新系统
  version: 1.0.0
  school: 东北石油大学
  upload-path: ./uploads

  # ========== AI 问答配置 ==========
  ai:
    # 本地语义匹配引擎配置
    local:
      # 未知问题置信度阈值(0-1)，低于此值判定为未知问题
      confidence-threshold: 0.25
      # 是否启用同义词扩展
      synonym-expansion: true

    # ==========================================
    # RAG 检索增强（AI 问答 RAG 化）
    # 全部参数外部化；非法值会在启动期直接失败并指明是哪个配置项
    # 向量存 kb_chunk.embedding（JSON 数组文本 —— MySQL 5.6 无 JSON 列类型）
    # ==========================================
    rag:
      enabled: true
      top-k-vector: 20            # 向量召回候选数，同时是 retrieve(topK) 的钳制上限
      top-k-keyword: 20           # 关键词召回候选数
      top-k-final: 5              # 最终注入 prompt 的材料条数（不约束检索层）
      min-score: 0.35             # vector 模式绝对门限（向量原始余弦）
      keyword-min-score: 0.1     # keyword 模式绝对门限（关键词原始余弦）
      relative-floor: 0.6         # 相对门限系数（候选原始分 >= 该系数 × top1 原始分）
      rrf-k: 60                   # RRF 平滑常数，仅影响融合排序，不参与门限
      max-per-document: 2         # 同一文档最多保留的 chunk 数
      chunk:
        size: 400                 # 单块目标字数上限
        overlap: 60               # 相邻块重叠字数
        min-size: 30              # 小于该长度的块并入相邻块
      embedding:
        provider: qwen         # 可选项: qwen / deepseek / glm / moonshot / openai / custom
        apiKey: "${DASHSCOPE_API_KEY:}"
        # ⚠️ embedding 必须用 embeddings 端点 + embedding 模型，不能用 chat 的
        #    （chat 端点期待 messages 字段，收到 embedding 的 input 会直接 400）
        apiUrl: "https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings"
        model: "text-embedding-v3"
        dimensions: 1024
        batch-size: 25            # 百炼单次请求上限 25
        connect-timeout: 10000
        read-timeout: 30000

    # ==========================================
    # 大模型API扩展配置（可选，默认关闭）
    # 支持 阿里Qwen / DeepSeek / 智谱GLM / Moonshot 等 OpenAI兼容API
    # 启用方式：将 enabled 设为 true，填入对应的 api-key 即可
    # 不启用时，系统使用本地TF-IDF语义引擎，同样智能且完全离线
    # ==========================================
    llm:
      # ---------- 开关 ----------
      enabled: true          # 是否启用外部大模型API

      # ---------- 当前使用的模型 ----------
      provider: qwen         # 可选项: qwen / deepseek / glm / moonshot / openai / custom
      apiKey: "${DASHSCOPE_API_KEY:}"
      apiUrl: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
      model: "qwen-plus"    # 千问Plus（已验证可用）
      timeout: 30000         # 请求超时(毫秒)
      maxTokens: 800         # 最大输出token数
      temperature: 0.7       # 随机性(0-2)，越低越确定

    # ==========================================
    # DeepSeek 问答（独立页面 /deepseek-chat）
    # 获取 API Key：https://platform.deepseek.com
    #   注册登录 → 左侧「API keys」→ 创建 API key → 复制粘贴到下面 apiKey
    # DeepSeek 为付费 API（注册赠送额度），每个 key 只属于一个账号
    # ==========================================
    deepseek:
      enabled: true            # 是否启用 DeepSeek 问答
      apiKey: "${DEEPSEEK_API_KEY:}"   # 用环境变量注入，禁止明文进仓库
      apiUrl: "https://api.deepseek.com/v1/chat/completions"
      model: "deepseek-v4-flash"   # deepseek-v4-flash=主力模型(快+便宜) / deepseek-v4-pro=推理加强(约3倍价格)
                                   # 注意：deepseek-chat / deepseek-reasoner 已于 2026-07-24 下线，调用会直接报错
      useRag: false            # 是否启用RAG(检索本地知识库增强回答)。false=纯大模型自由回答（不依赖ai_knowledge表）
                               # true=先从知识库检索Top3材料注入提示词，DeepSeek基于材料回答（学校信息更准确）
      timeout: 30000           # 请求超时(毫秒)
      maxTokens: 0             # 最大输出token数；0 = 不限制（请求不传该参数，由模型上限决定，V4最高384K）
                               # 需要控制输出长度/费用时改为具体数值，如 800

      # ---------- Agent（工具调用）配置 ----------
      # enabled=false 时 /deepseek-chat 行为与改造前完全一致（可回退）
      agent:
        enabled: true
        max-steps: 5                  # 循环步数上限，防模型陷入工具循环烧 token
        token-budget: 30000           # 单次提问累计 token 预算，超限即停止并返回已有结果
        tool-result-max-chars: 4000   # 单个工具结果回填上限，超出截断（防 token 爆炸）
        history-rounds: 3             # 携带的历史轮数
        trace-enabled: true           # 是否记录工具调用轨迹（agent_tool_call_log）
#      temperature: 0.7         # 随机性(0-2)，越低越确定

